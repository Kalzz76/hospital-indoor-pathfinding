<!DOCTYPE html>
<html class="light" lang="en">
  <head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Central Medical - Login Portal</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght@100..700,0..1&amp;display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet" />
    <script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "primary": "#ec5b13",
              "background-light": "#f8f6f6",
              "background-dark": "#221610",
            },
            fontFamily: {
              "display": ["Public Sans"]
            },
            borderRadius: {
              "DEFAULT": "0.25rem",
              "lg": "0.5rem",
              "xl": "0.75rem",
              "full": "9999px"
            },
          },
        },
      }
    </script>
    <style>
      .gradient-brand {
        background: linear-gradient(135deg, #ec5b13 0%, #a855f7 50%, #3b82f6 100%);
      }

      .soft-bg-gradient {
        background: radial-gradient(circle at top right, rgba(236, 91, 19, 0.05), transparent),
          radial-gradient(circle at bottom left, rgba(59, 130, 246, 0.05), transparent);
      }
    </style>
    <style>
      body {
        min-height: max(884px, 100dvh);
      }
    </style>
  </head>
  <body class="bg-background-light dark:bg-background-dark font-display text-slate-900 dark:text-slate-100 min-h-screen flex flex-col">
    <div class="flex-1 flex flex-col items-center justify-center p-4 soft-bg-gradient">
      <!-- Login Container -->
      <div class="w-full max-w-[440px] bg-white dark:bg-slate-900/50 backdrop-blur-md rounded-xl shadow-2xl overflow-hidden border border-slate-200 dark:border-slate-800">
        <!-- TopAppBar Style Header -->
        <div class="p-8 pb-4 text-center">
          <div class="flex flex-col items-center gap-3">
            <div class="gradient-brand p-3 rounded-xl shadow-lg inline-flex items-center justify-center">
              <span class="material-symbols-outlined text-white text-3xl">medical_services</span>
            </div>
            <div>
              <h2 class="text-2xl font-bold tracking-tight text-slate-900 dark:text-white">Central Medical</h2>
              <p class="text-slate-500 dark:text-slate-400 text-sm mt-1">Admin &amp; User Portal</p>
            </div>
          </div>
        </div>
        <!-- Form Section -->
        <div class="px-8 pt-4 pb-10">
          <h1 class="text-xl font-bold text-slate-800 dark:text-slate-100 mb-6">Welcome Back</h1>
          <form action="#" class="space-y-5">
            <!-- Full Name Field -->
            <div class="flex flex-col gap-2">
              <label class="text-sm font-semibold text-slate-700 dark:text-slate-300 ml-1">Full Name</label>
              <div class="relative">
                <span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 text-xl">person</span>
                <input class="w-full pl-12 pr-4 h-14 bg-slate-50 dark:bg-slate-800 border-slate-200 dark:border-slate-700 rounded-xl focus:ring-2 focus:ring-primary/20 focus:border-primary transition-all text-base outline-none" placeholder="Enter your full name" type="text" />
              </div>
            </div>
            <!-- Email Field -->
            <div class="flex flex-col gap-2">
              <label class="text-sm font-semibold text-slate-700 dark:text-slate-300 ml-1">Email Address</label>
              <div class="relative">
                <span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 text-xl">mail</span>
                <input class="w-full pl-12 pr-4 h-14 bg-slate-50 dark:bg-slate-800 border-slate-200 dark:border-slate-700 rounded-xl focus:ring-2 focus:ring-primary/20 focus:border-primary transition-all text-base outline-none" placeholder="name@example.com" type="email" />
              </div>
            </div>
            <!-- Password Field -->
            <div class="flex flex-col gap-2">
              <div class="flex justify-between items-center ml-1">
                <label class="text-sm font-semibold text-slate-700 dark:text-slate-300">Password</label>
                <a class="text-xs font-medium text-primary hover:underline" href="#">Forgot Password?</a>
              </div>
              <div class="relative">
                <span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 text-xl">lock</span>
                <input class="w-full pl-12 pr-12 h-14 bg-slate-50 dark:bg-slate-800 border-slate-200 dark:border-slate-700 rounded-xl focus:ring-2 focus:ring-primary/20 focus:border-primary transition-all text-base outline-none" placeholder="••••••••" type="password" />
                <span class="material-symbols-outlined absolute right-4 top-1/2 -translate-y-1/2 text-slate-400 text-xl cursor-pointer hover:text-slate-600">visibility</span>
              </div>
            </div>
            <!-- Login Button -->
            <button class="w-full h-14 gradient-brand text-white font-bold rounded-xl shadow-lg shadow-primary/20 hover:shadow-primary/40 active:scale-[0.98] transition-all text-lg mt-4 flex items-center justify-center gap-2" type="submit"> Login <span class="material-symbols-outlined">login</span>
            </button>
          </form>
          <!-- Footer Links -->
          <div class="mt-8 text-center">
            <p class="text-slate-500 dark:text-slate-400 text-sm"> Don't have an account? <a class="text-primary font-semibold hover:underline" href="#">Sign Up</a>
            </p>
          </div>
        </div>
      </div>
      <!-- Support Info -->
      <div class="mt-8 flex items-center gap-6 text-slate-400 text-xs font-medium uppercase tracking-widest">
        <a class="hover:text-primary transition-colors" href="#">Privacy Policy</a>
        <span class="size-1 rounded-full bg-slate-300 dark:bg-slate-700"></span>
        <a class="hover:text-primary transition-colors" href="#">Terms of Service</a>
        <span class="size-1 rounded-full bg-slate-300 dark:bg-slate-700"></span>
        <a class="hover:text-primary transition-colors" href="#">Contact Support</a>
      </div>
    </div>
    <!-- Decorative Background Elements -->
    <div class="fixed top-0 left-0 w-full h-full -z-10 pointer-events-none overflow-hidden opacity-50">
      <div class="absolute -top-24 -right-24 w-96 h-96 bg-primary/10 rounded-full blur-3xl"></div>
      <div class="absolute -bottom-24 -left-24 w-96 h-96 bg-blue-500/10 rounded-full blur-3xl"></div>
    </div>
  </body>
</html>
